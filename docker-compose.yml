version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: dsite-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-example}
    ports:
      - '27017:27017'

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dsite-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASS:-example}@mongo:27017/dsite?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-local_dev_access_secret_min_32_characters_long_12345}
      REFRESH_SECRET: ${REFRESH_SECRET:-local_dev_refresh_secret_min_32_characters_long_12345}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      - mongo
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: dsite-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - '80:8080'

volumes:
  mongo-data:
